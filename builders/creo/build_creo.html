    return { model: twin, how: 'twin of ' + base };
  }
  throw new NotScripted('no Creo.JS function for this design yet: write ' + design.id + ' in creo_recipes.creojs, or make ' +
                        design.file + ' by hand from its steps and run the builder again');
}

function runBuilder(optionsText) {
  var opts = JSON.parse(optionsText || '{}');
  if (opts.useExisting === undefined) opts.useExisting = true;
  var session = pfcGetCurrentSession();
  var here = '';
  try { here = String(session.GetCurrentDirectory() || ''); } catch (e) { }
  if (personalFolder(here)) return JSON.stringify({ finish: PERSONAL_FOLDER, saved: false, results: '[]', log: '' });
  var lines = [];
  var log = function (id, step) { lines.push(new Date().toISOString() + ' builder=' + BUILDER_VERSION + ' recipe=' + id + ' step=' + step); };
  var only = (opts.only || '').split(/[\s,]+/).filter(Boolean);
  var rows = [], built = {};
  log('-', 'start designs=' + KIT.designs.length + (only.length ? ' only=' + only.join(',') : ''));
  KIT.designs.forEach(function (design) {
    if (only.length && only.indexOf(design.id) < 0) return;
    var t0 = Date.now();
    var row = { id: design.id, status: 'not_scripted', error: '', files: [], app: 'Creo', version: opts.version || 'unknown',
                build: opts.build || '', builder: BUILDER_VERSION, output_folder: opts.folder || '' };
    var ctx = makeContext(session, design, built, log);
    try {
      // The booklet's Creo tool table says Creo cannot make this one; the reason is its skip line.
      if (design.creo_skip) throw new NotScripted('Creo cannot make this: ' + design.creo_skip + ' (booklet, Creo tools)');
      var got = obtain(ctx, design, opts);
      row.made = got.how;
      log(design.id, 'made ' + got.how);
      var m = design.kind !== 'assembly' ? measure(got.model, design.expect)
            : design.expect.assembly ? measureAssembly(session, got.model, design.expect.assembly) : null;
      if (m) {
        row.measured = m.found;
        if (m.problems.length) throw new Error('does not match the answer key: ' + m.problems.join('; '));
      }
      blankPersonal(got.model);
      got.model.Save();
      log(design.id, 'saved');
      got.model.ExportIntf3D(design.file.replace(/\.(prt|asm)$/, ''), pfcExportType.EXPORT_STEP, void 0);
      log(design.id, 'step exported');
      built[design.id] = got.model;
      row.status = 'ok';
      row.files = [design.file, design.step];
    } catch (e) {
      row.status = e instanceof NotScripted ? 'not_scripted' : 'failed';
      row.error = errorText(e);
      log(design.id, row.status + ' ' + row.error);
    }
    row.seconds = Math.round((Date.now() - t0) / 10) / 100;
    rows.push(row);
  });
  var counts = { ok: 0, failed: 0, not_scripted: 0 };
  rows.forEach(function (r) { counts[r.status]++; });
  var finish = rows.length + ' recipe' + (rows.length === 1 ? '' : 's') + ': ' + counts.ok + ' built, ' + counts.failed + ' failed, ' +
               counts.not_scripted + ' not scripted (details in FixtureBuilder.log).\n' +
               'Next: run pack_creo.ps1 in this folder; it zips it and names the zip to send to Dutchy in a Discord direct message.';
  lines.push(new Date().toISOString() + ' builder=' + BUILDER_VERSION + ' recipe=- step=finish ' + finish.split('\n')[0]);
  var results = JSON.stringify(rows, null, 1);
  var saved = false;
  if (typeof writeFileAsString === 'function') {
    try { writeFileAsString('results.json', results); writeFileAsString('FixtureBuilder.log', lines.join('\n') + '\n'); saved = true; } catch (e) { }
  }
  return JSON.stringify({ finish: finish, saved: saved, results: results, log: lines.join('\n') + '\n' });
}
</script>
<script>
  function save(name, text) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    a.download = name;
    a.click();
  }
  var last = null;
  // The same as scrubText in the builder: people screenshot this page.
  function pageScrub(text) {
    return text.replace(/(?:[A-Za-z]:)?[\\\/]+(Users|Documents and Settings)[\\\/]+(?!(Public|Default|All Users|Shared)([\\\/"]|$))[^\\\/"'<>|\r\n]+(?:[^"'<>|\r\n\\]|\\(?!"))*/gi, '%USERPROFILE%')
      .replace(/\/(home|Users)\/(?!(Shared|Public)(\/|$))[^\/"'<>|\r\n]+(?:[^"'<>|\r\n\\]|\\(?!"))*/g, '/%USERPROFILE%').replace(/OneDrive(?:[^"'<>|\r\n\\]|\\(?!"))*/gi, '%OneDrive%').replace(/\\\\[^\\\/"'<>|\r\n]+\\(?:[^"'<>|\r\n\\]|\\(?!"))*/g, '%SHARE%');
  }
  function run() {
    var opts = { version: document.getElementById('version').value.trim(), build: document.getElementById('build').value.trim(),
                 only: document.getElementById('only').value.trim(), useExisting: document.getElementById('existing').checked };
    document.getElementById('summary').textContent = 'Running. Leave Creo alone until this line changes.';
    try {
      CreoJS.runBuilder(JSON.stringify(opts)).then(function (text) {
        last = JSON.parse(text);
        document.getElementById('summary').textContent = last.finish +
          (last.saved ? '' : '\n(Creo did not let the page write files: click Save results and Save log, and put both in the working folder.)');
        document.getElementById('out').value = last.results;
      }, function (e) { document.getElementById('summary').textContent = 'The builder stopped: ' + pageScrub(String(e)); });
    } catch (e) { document.getElementById('summary').textContent = 'Creo.JS is not reachable from this page: ' + pageScrub(String(e)) + '. Is creojs.js next to it?'; }
  }
</script>
</head>
<body>
<h1>Creo Fixture Builder</h1>
<p class="muted">Working directory: a new, empty folder (File, Manage Session, Select Working Directory). Your own models are not opened.</p>
<p><label>Creo release <input id="version" placeholder="10.0.3.0"></label>
   <label>Build (optional) <input id="build" placeholder=""></label></p>
<p><label>Only these designs (optional) <input id="only" size="40" placeholder="P01a P01b"></label>
   <label><input id="existing" type="checkbox" checked> Use files already in the folder (made by hand)</label></p>
<p><button onclick="run()">Run</button>
   <button onclick="last && save('results.json', last.results)">Save results</button>
   <button onclick="last && save('FixtureBuilder.log', last.log)">Save log</button></p>
<pre id="summary"></pre>
<textarea id="out" readonly></textarea>
</body>
</html>
