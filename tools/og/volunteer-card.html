<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f4f4f2;font-family:"Inter","Noto Sans","DejaVu Sans",system-ui,sans-serif;color:#1b2420;position:relative}
.bar{position:absolute;left:0;top:0;bottom:0;width:14px;background:#1f6f5c}
.wrap{position:absolute;left:70px;top:58px;width:640px}
.kicker{font:500 26px/1 "DejaVu Sans Mono",monospace;color:#1f6f5c;letter-spacing:.02em}
h1{margin:18px 0 0;font-size:74px;line-height:1;font-weight:800;letter-spacing:-.01em}
.sub{margin:22px 0 0;font-size:29px;line-height:1.3;color:#3f4a45}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.chip{border:2px solid #1f6f5c;color:#1f6f5c;border-radius:999px;padding:7px 16px;font-size:20px;font-weight:700}
.cta{position:absolute;left:14px;right:0;bottom:0;height:104px;background:#5865f2;color:#fff;display:flex;align-items:center;gap:22px;padding-left:56px}
.cta svg{width:54px;height:54px;fill:#fff;flex:none}
.cta .t{font-size:36px;font-weight:800}
.cta .t code{font-family:"DejaVu Sans Mono",monospace;background:rgba(255,255,255,.18);border-radius:8px;padding:2px 12px}
.art{position:absolute;right:70px;top:84px;width:360px;height:360px}
.mark{position:absolute;right:92px;bottom:150px;width:120px;height:120px;border-radius:28px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12);display:grid;place-items:center}
.mark img{width:88px;height:88px}
</style></head><body>

</div>
